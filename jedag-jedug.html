<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JEDAG JEDUG ✨</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    display: grid;
    place-items: center;
    background: #05010f;
    position: relative;
  }

  /* Background gradient yang gonta-ganti warna */
  .bg {
    position: fixed;
    inset: -20%;
    background: linear-gradient(130deg,
      #ff006e, #fb5607, #ffbe0b, #8338ec, #3a86ff, #06ffa5, #ff006e);
    background-size: 400% 400%;
    filter: blur(60px) saturate(1.4);
    opacity: 0.55;
    animation: flow 9s ease-in-out infinite, beatbg 0.5s steps(1) infinite;
    z-index: 0;
  }
  @keyframes flow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes beatbg {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 0.8; }
  }

  /* Lingkaran-lingkaran neon yang mantul */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(40px);
    mix-blend-mode: screen;
    z-index: 1;
  }
  .b1 { width: 340px; height: 340px; background: #ff006e; top: 8%;  left: 10%; animation: float1 6s ease-in-out infinite; }
  .b2 { width: 300px; height: 300px; background: #3a86ff; bottom: 6%; right: 8%; animation: float2 7s ease-in-out infinite; }
  .b3 { width: 260px; height: 260px; background: #06ffa5; bottom: 20%; left: 18%; animation: float3 5s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(60px,40px) scale(1.2);} }
  @keyframes float2 { 0%,100%{transform:translate(0,0) scale(1.1);} 50%{transform:translate(-50px,-30px) scale(0.9);} }
  @keyframes float3 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(40px,-50px) scale(1.25);} }

  /* Teks utama yang nge-beat */
  .stage { position: relative; z-index: 2; text-align: center; }
  h1 {
    font-size: clamp(2.8rem, 12vw, 8rem);
    font-weight: 900;
    letter-spacing: 0.05em;
    line-height: 0.95;
    background: linear-gradient(90deg, #ff006e, #ffbe0b, #06ffa5, #3a86ff, #ff006e);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: hue 4s linear infinite, beat 0.5s ease-in-out infinite;
    text-shadow: 0 0 40px rgba(255, 0, 110, 0.4);
  }
  @keyframes hue  { to { background-position: 300% 0; } }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25%      { transform: scale(1.12); }
    50%      { transform: scale(0.97); }
    75%      { transform: scale(1.06); }
  }

  .sub {
    margin-top: 1.2rem;
    font-size: clamp(1rem, 3vw, 1.6rem);
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.9;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0.35; } }

  .credit {
    margin-top: 2.5rem;
    font-size: 0.95rem;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.1em;
  }
  .credit b { color: #ffbe0b; }

  /* Equalizer bar jedag-jedug */
  .eq { display: flex; gap: 8px; justify-content: center; margin-top: 2rem; height: 80px; align-items: flex-end; }
  .eq span {
    width: 14px;
    border-radius: 6px;
    background: linear-gradient(#06ffa5, #3a86ff);
    animation: bar 0.6s ease-in-out infinite;
  }
  .eq span:nth-child(1){ animation-delay:0s;    background:linear-gradient(#ff006e,#fb5607);}
  .eq span:nth-child(2){ animation-delay:0.1s;  background:linear-gradient(#fb5607,#ffbe0b);}
  .eq span:nth-child(3){ animation-delay:0.2s;  background:linear-gradient(#ffbe0b,#06ffa5);}
  .eq span:nth-child(4){ animation-delay:0.3s;  background:linear-gradient(#06ffa5,#3a86ff);}
  .eq span:nth-child(5){ animation-delay:0.15s; background:linear-gradient(#3a86ff,#8338ec);}
  .eq span:nth-child(6){ animation-delay:0.25s; background:linear-gradient(#8338ec,#ff006e);}
  .eq span:nth-child(7){ animation-delay:0.05s; background:linear-gradient(#ff006e,#ffbe0b);}
  @keyframes bar { 0%,100%{ height: 20px; } 50%{ height: 80px; } }

  @media (prefers-reduced-motion: reduce) {
    .bg, .blob, h1, .sub, .eq span { animation: none !important; }
    .bg { opacity: 0.4; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="stage">
    <h1>JEDAG<br>JEDUG</h1>
    <div class="sub">✨ warna warni ✨</div>
    <div class="eq">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="credit">Dibuat bareng <b>Celestyn</b> &amp; <b>Kiro</b> 👻</div>
  </div>
</body>
</html>
